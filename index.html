<!DOCTYPE html>
<html lang="fr">

<title>Force entre fils parallèles — corrigé</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;font-family:system-ui,-apple-system,sans-serif;}
canvas{display:block;border-radius:12px;border:1.5px solid #e8e8e8;touch-action:none;cursor:grab;}
.btn{padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#ffffff;color:#2c2c2a;}
.btn.on{border-color:#185fa5;background:#e6f1fb;color:#185fa5;}
.row{display:flex;align-items:center;gap:12px;margin:6px 0;flex-wrap:wrap;}
.lbl{font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;}
.val{min-width:58px;text-align:center;font-size:13px;font-weight:500;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 10px;}
.fml{font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:6px 0 10px;font-family:ui-monospace,monospace;line-height:1.9;display:block;width:100%;}
#info{font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:6px 0;font-family:ui-monospace,monospace;line-height:1.8;}
</style>
<style id="sfa-kit">
/* Kit SFA (clair) — plan blanc sur fond gris-bleu froid, encre bleu nuit, or en accent unique, réglages en règle graduée. */
:root{--bg:#f3f5f8;--paper:#ffffff;--ink:#0c1f2e;--muted:#5b6b7b;--faint:#8a98a6;--rule:#dfe4ea;--rule2:#c9d1da;
  --gold:#d9973f;--gold-ink:#9a6420;--press:#e9edf2;
  --f-ui:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;--f-math:"STIX Two Text","Cambria Math",serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
html{background:var(--bg)}
body{background:var(--bg)!important;color:var(--ink);font-family:var(--f-ui)!important;font-size:15px;line-height:1.5;
  max-width:1180px;margin:0 auto!important;padding:20px 16px 32px!important}
.sfa-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;
  border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:16px}
.sfa-head h1{font:700 1.5rem/1.2 var(--f-ui);margin:0;letter-spacing:-.005em;text-wrap:balance}
.sfa-head h1 small{display:block;font:400 .88rem var(--f-ui);color:var(--muted);margin-top:3px}
.sfa-head .sfa-tag{font:600 .8rem var(--f-ui);color:var(--muted)}
.sfa-head .sfa-tag b{color:var(--gold-ink);font-weight:700}
select{font:500 .86rem var(--f-ui)!important;border:1px solid var(--rule2)!important;border-radius:3px!important;background:var(--paper)!important;color:var(--ink)!important;padding:5px 8px!important}
.sfa-stage{border:1px solid var(--rule)!important;border-radius:4px!important;box-shadow:0 1px 2px rgba(12,31,46,.05),0 8px 24px -16px rgba(12,31,46,.18)}
.sfa-stage canvas{border:0!important;box-shadow:none!important}
canvas{background:var(--paper);border:1px solid var(--rule)!important;border-radius:4px!important;box-shadow:0 1px 2px rgba(12,31,46,.05),0 8px 24px -16px rgba(12,31,46,.18)}
.row{gap:12px!important;margin:10px 0!important}
.pill,.lbl,.tag{background:none!important;border:0!important;border-radius:0!important;padding:0!important;
  font:600 .86rem var(--f-ui)!important;color:var(--muted);min-width:0}
.val{background:none!important;border:0!important;border-radius:0!important;padding:0!important;
  font:500 .9rem var(--f-num)!important;font-variant-numeric:tabular-nums;text-align:right}
.btn{background:transparent!important;border:1px solid var(--rule2)!important;border-radius:3px!important;color:var(--muted)!important;
  font:600 .82rem var(--f-ui)!important;padding:6px 12px!important;transition:color .15s,background .15s}
.btn:hover{color:var(--ink)!important;background:var(--press)!important}
.btn.on{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important;box-shadow:inset 0 -2px 0 var(--gold)}
.fml{background:transparent!important;border:0!important;border-left:2px solid var(--gold)!important;border-radius:0!important;
  font:400 1.08rem/1.7 var(--f-math)!important;color:var(--ink);padding:4px 0 4px 14px!important;margin:14px 0!important}
.info{background:var(--paper)!important;border:1px solid var(--rule)!important;border-radius:3px!important;
  font:500 .84rem/1.8 var(--f-num)!important;color:var(--muted)!important;padding:8px 14px!important}
input[type=range]{-webkit-appearance:none;appearance:none;height:24px;background:linear-gradient(var(--rule2),var(--rule2)) center/100% 2px no-repeat;cursor:pointer;--pc:var(--gold)}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:transparent}
input[type=range]::-moz-range-track{height:2px;background:transparent}
input[type=range]::-moz-range-progress{height:2px;background:var(--pc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:20px;border-radius:1px;background:var(--pc);margin-top:-9px;border:0}
input[type=range]::-moz-range-thumb{width:6px;height:20px;border-radius:1px;background:var(--pc);border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sfa-foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Curseurs : la couleur du curseur reprend celle de son accent-color d'origine ; remplissage gauche en couleur. */
addEventListener('DOMContentLoaded',()=>{
/* Curseurs : couleur reprise de accent-color, remplissage à gauche. Resynchronisé en continu pour suivre
   les curseurs créés ou déplacés par la simulation elle-même. */
const fill=r=>{if(!r.dataset.sfa){r.dataset.sfa=1;const c=r.style.accentColor||getComputedStyle(r).accentColor;
    if(c&&c!=='auto')r.style.setProperty('--pc',c);}
  const v=r.value+'|'+r.min+'|'+r.max;if(r._sv===v)return;r._sv=v;
  const p=(r.value-r.min)/(r.max-r.min)*100;
  r.style.background=`linear-gradient(to right,var(--pc) ${p}%,var(--rule2) ${p}%) center/100% 2px no-repeat`;};
const all=()=>document.querySelectorAll('input[type=range]').forEach(fill);
all();document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))fill(e.target);});
setInterval(all,150);
/* Contrôles écrits en style en ligne (sans classe) : on leur donne les classes du kit. */
const st=e=>(e.getAttribute('style')||'').replace(/\s/g,'').toLowerCase();
const isPill=e=>/border-radius:(1[6-9]|20|99)px/.test(st(e));
document.querySelectorAll('span').forEach(sp=>{if(sp.classList.length||!isPill(sp))return;
  const n=sp.nextElementSibling,pv=sp.previousElementSibling;
  if(n&&n.matches('input[type=range],select,button'))sp.classList.add('pill');
  else if(pv&&pv.matches('input[type=range],select'))sp.classList.add('val');
  else sp.classList.add('pill');});
document.querySelectorAll('div').forEach(d=>{if(d.classList.length)return;const s=st(d);
  if(/border-radius:(1[6-9]|20)px/.test(s)&&/monospace/.test(s))d.classList.add(d.id==='fml'?'fml':'info');
  else if(d.querySelector(':scope>canvas')&&/border-radius:1[0-4]px/.test(s))d.classList.add('sfa-stage');});
const tag=b=>{const s=st(b);b.classList.toggle('on',/#185fa5|rgb\(24,95,165\)/.test(s)&&!/#fff[;f]|#ffffff|rgb\(255,255,255\)/.test(s.match(/background:[^;]+/)?.[0]||''));};
document.querySelectorAll('button:not(.btn)').forEach(b=>{b.classList.add('btn','sfa-n');tag(b);});
new MutationObserver(ms=>ms.forEach(m=>{if(m.target.classList&&m.target.classList.contains('sfa-n'))tag(m.target);}))
  .observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']});
});
</script>
<header class="sfa-head"><h1>Forces entre fils parallèles<small>Courants de même sens ou de sens opposés</small></h1><span class="sfa-tag"><b>SFA</b> · Physique · Magnétisme</span></header>


</head>
<body>

<canvas id="cv" style="width:100%;height:62vh;min-height:340px;"></canvas>

<div class="fml">
  F/L = μ₀·I₁·I₂ / (2π·d) &nbsp;|&nbsp; <span style="color:#1D9E75">même sens → attraction</span> &nbsp;|&nbsp; <span style="color:#BA7517">sens opposés → répulsion</span>
</div>
<div class="row">
  <span class="lbl">Courant I₁</span>
  <input type="range" id="i1" min="-10" max="10" value="6" step="1" style="flex:1;accent-color:#E24B4A;cursor:pointer;">
  <span class="val" id="i1v" style="color:#E24B4A;border-color:#f09595;background:#fff;">+6 A</span>
</div>
<div class="row">
  <span class="lbl">Courant I₂</span>
  <input type="range" id="i2" min="-10" max="10" value="4" step="1" style="flex:1;accent-color:#7F77DD;cursor:pointer;">
  <span class="val" id="i2v" style="color:#7F77DD;border-color:#AFA9EC;background:#fff;">+4 A</span>
</div>
<div id="info" style="font-size:12px;padding:7px 14px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#666;margin:4px 0;font-family:ui-monospace,monospace;line-height:1.8;"></div>

<script>
const cv = document.getElementById('cv');
let W = 0, H = 0, animT = 0;
const MU0 = 4 * Math.PI * 1e-7;

// Positions normalisées des fils
const wires = [{ nx: -0.22, ny: 0 }, { nx: 0.22, ny: 0 }];

document.getElementById('i1').addEventListener('input', function () {
  document.getElementById('i1v').textContent = (parseFloat(this.value) >= 0 ? '+' : '') + this.value + ' A';
});
document.getElementById('i2').addEventListener('input', function () {
  document.getElementById('i2v').textContent = (parseFloat(this.value) >= 0 ? '+' : '') + this.value + ' A';
});

function syncSize() {
  const r = cv.getBoundingClientRect();
  const nW = Math.round(r.width) || 700, nH = Math.round(r.height) || 360;
  if (nW !== W || nH !== H) { W = nW; H = nH; cv.width = W; cv.height = H; }
}

function cpx(w) { return W * 0.5 + w.nx * W * (W < 600 ? 0.6 : 0.36); } // écran étroit : fils plus écartés pour ne pas se chevaucher
function cpy(w) { return H * 0.55 + w.ny * H * 0.3; }

/**
 * Champ B d'UN fil infini en (px, py), fil situé en (wx, wy), portant le courant I (en z).
 *
 * RÈGLE DE LA MAIN DROITE :
 *   Fil dans la direction +z (courant positif sorti de la page ⊙) :
 *   B tourne dans le sens trigonométrique (antihoraire) autour du fil.
 *   En coordonnées 2D canvas (y vers le bas), le sens anti-horaire est :
 *     - Au-dessus du fil (dy < 0) → B pointe vers la droite (+x)
 *     - À droite du fil (dx > 0)  → B pointe vers le bas (+y)
 *   Soit : B ∝ I · (dy, -dx) / r²
 *   (et non (-dy, dx) qui serait le sens horaire)
 *
 *   Pour un courant négatif (⊗, rentrant dans la page), le sens s'inverse.
 */
function fieldBsingle(px, py, wx, wy, I) {
  const dx = px - wx, dy = py - wy;
  const r2 = dx * dx + dy * dy;
  if (r2 < 25) return { Bx: 0, By: 0 };
  // Magnitude : B = μ₀|I| / (2π r), normalisée pour le tracé
  const B = MU0 * Math.abs(I) / (2 * Math.PI * Math.sqrt(r2) * 0.005);
  const sign = I > 0 ? 1 : -1;
  const r = Math.sqrt(r2);
  // Vecteur tangentiel anti-horaire en coord. canvas : (dy, -dx) / r
  // ⚠️  EN CANVAS y est VERS LE BAS, donc "anti-horaire visuel" = (dy, -dx)
  //     Ce qui correspond bien à la règle de la main droite pour I > 0 (⊙)
  return { Bx: sign * B * (dy / r), By: sign * B * (-dx / r) };
}

// Champ total des deux fils
function totalField(px, py, I1, I2) {
  const { Bx: b1x, By: b1y } = fieldBsingle(px, py, cpx(wires[0]), cpy(wires[0]), I1);
  const { Bx: b2x, By: b2y } = fieldBsingle(px, py, cpx(wires[1]), cpy(wires[1]), I2);
  return { Bx: b1x + b2x, By: b1y + b2y };
}

// Texte sur fond blanc semi-opaque (lisible par-dessus les lignes de champ)
function bgText(ctx, t, x, y, col) {
  const w = ctx.measureText(t).width, al = ctx.textAlign;
  const x0 = al === 'left' ? x : al === 'right' ? x - w : x - w / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.beginPath(); ctx.roundRect(x0 - 4, y - 12, w + 8, 16, 4); ctx.fill();
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}

function arrowHead(ctx, x, y, dx, dy, size, col) {
  const l = Math.sqrt(dx * dx + dy * dy); if (l < 0.001) return;
  ctx.fillStyle = col; ctx.save(); ctx.translate(x, y);
  ctx.rotate(Math.atan2(dy / l, dx / l));
  ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * .7, -size * .5); ctx.lineTo(-size * .7, size * .5);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/**
 * Trace une ligne de champ depuis le point de départ (sx, sy)
 * en suivant le champ TOTAL (intégration Euler).
 * Le sens de parcours est celui du champ B au point de départ.
 */
function traceLine(ctx, sx, sy, col, I1, I2) {
  let x = sx, y = sy;
  const ox = x, oy = y;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.strokeStyle = col + '77'; ctx.lineWidth = 1.4;
  const pts = [{ x, y }];
  for (let s = 0; s < 1200; s++) {
    const { Bx, By } = totalField(x, y, I1, I2);
    const Bn = Math.sqrt(Bx * Bx + By * By); if (Bn < 1e-12) break;
    const step = 4;
    x += step * Bx / Bn;
    y += step * By / Bn;
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) break;
    ctx.lineTo(x, y);
    pts.push({ x, y, dx: step * Bx / Bn, dy: step * By / Bn });
    if (s > 80 && Math.sqrt((x - ox) ** 2 + (y - oy) ** 2) < 8) break;
  }
  ctx.stroke();
  for (const frac of [0.25, 0.55, 0.82]) {
    const idx = Math.floor(frac * pts.length);
    if (!pts[idx] || !pts[idx].dx) continue;
    arrowHead(ctx, pts[idx].x, pts[idx].y, pts[idx].dx, pts[idx].dy, 6, col + 'cc');
  }
}

let I1 = 6, I2 = 4;

function draw() {
  syncSize(); animT += 0.02;
  I1 = parseFloat(document.getElementById('i1').value);
  I2 = parseFloat(document.getElementById('i2').value);

  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  const cx1 = cpx(wires[0]), cy1 = cpy(wires[0]);
  const cx2 = cpx(wires[1]), cy2 = cpy(wires[1]);

  /**
   * DENSITÉ DE LIGNES : nL lignes réparties UNIFORMÉMENT sur 360° autour du fil.
   * On utilise nL = min(10, |I|), avec des angles uniformément espacés.
   * Les rayons de départ sont fixes (assez proches du fil pour rester dans la zone).
   * 
   * Pourquoi angles uniformément répartis ?
   *   → Une densité de lignes uniforme en angle représente correctement
   *     un champ isotrope autour d'un fil infini (B ne dépend que de r).
   */
  const nL1 = Math.min(10, Math.max(0, Math.round(Math.abs(I1))));
  const nL2 = Math.min(10, Math.max(0, Math.round(Math.abs(I2))));

  // Rayon de départ unique (relativement proche du fil)
  const startR = 32;

  // Lignes fil 1 — nL1 lignes à angles équirépartis
  for (let li = 0; li < nL1; li++) {
    const angle = (2 * Math.PI * li) / nL1;
    const sx = cx1 + startR * Math.cos(angle);
    const sy = cy1 + startR * Math.sin(angle);
    traceLine(ctx, sx, sy, '#E24B4A', I1, I2);
  }

  // Lignes fil 2 — nL2 lignes à angles équirépartis
  for (let li = 0; li < nL2; li++) {
    const angle = (2 * Math.PI * li) / nL2;
    const sx = cx2 + startR * Math.cos(angle);
    const sy = cy2 + startR * Math.sin(angle);
    traceLine(ctx, sx, sy, '#7F77DD', I1, I2);
  }

  // Distance entre fils
  const dx = cx2 - cx1, dy = cy2 - cy1;
  const d = Math.sqrt(dx * dx + dy * dy);
  const dM = d * 0.005; // en mètres (1 pixel = 0.005 m)

  // Force par unité de longueur
  const FperL = (I1 !== 0 && I2 !== 0) ? MU0 * Math.abs(I1 * I2) / (2 * Math.PI * dM) : 0;
  const attract = I1 * I2 > 0;
  const arrowCol = attract ? '#1D9E75' : '#BA7517';
  const maxF = MU0 * 100 / (2 * Math.PI * dM);
  const ratio = Math.min(FperL / maxF, 1);
  const arrowLen = ratio * Math.min(W, H) * 0.18 + 12;

  // Flèches de force sur les fils
  if (FperL > 0 && d > 0) {
    const ux = (cx2 - cx1) / d, uy = (cy2 - cy1) / d;
    const s1 = attract ? 1 : -1, s2 = attract ? -1 : 1;
    ctx.strokeStyle = arrowCol; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx1 + ux * s1 * arrowLen, cy1 + uy * s1 * arrowLen); ctx.stroke();
    arrowHead(ctx, cx1 + ux * s1 * arrowLen, cy1 + uy * s1 * arrowLen, ux * s1, uy * s1, 10, arrowCol);
    ctx.beginPath(); ctx.moveTo(cx2, cy2); ctx.lineTo(cx2 + ux * s2 * arrowLen, cy2 + uy * s2 * arrowLen); ctx.stroke();
    arrowHead(ctx, cx2 + ux * s2 * arrowLen, cy2 + uy * s2 * arrowLen, ux * s2, uy * s2, 10, arrowCol);
  }

  // Barre d'intensité force
  const barTotalW = Math.min(W * 0.55, 280);
  const barH = 10;
  const barX = W / 2 - barTotalW / 2;
  const barY = 28;
  const barFill = barTotalW * ratio;

  ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.roundRect(barX, barY, barTotalW, barH, 5); ctx.fill();
  if (barFill > 0) {
    ctx.fillStyle = arrowCol; ctx.beginPath(); ctx.roundRect(barX, barY, barFill, barH, 5); ctx.fill();
  }
  ctx.strokeStyle = arrowCol + '88'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(barX, barY, barTotalW, barH, 5); ctx.stroke();

  ctx.font = '500 13px Mulish,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = arrowCol;
  bgText(ctx, (attract ? 'Attraction' : 'Répulsion') + ' — F/L = ' + (FperL * 1000).toFixed(2) + ' mN/m', W / 2, barY - 6, arrowCol);

  // Distance label
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(cx1, cy1 + 50); ctx.lineTo(cx2, cy2 + 50); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '11px Mulish,system-ui,sans-serif'; ctx.textAlign = 'center';
  bgText(ctx, 'd = ' + (dM * 100).toFixed(1) + ' cm', (cx1 + cx2) / 2, (cy1 + cy2) / 2 + 64, '#666');

  // Fils
  const wData = [
    { I: I1, cx: cx1, cy: cy1, col: '#E24B4A', bg: '#fee2e2', lbl: 'I₁' },
    { I: I2, cx: cx2, cy: cy2, col: '#7F77DD', bg: '#EEEDFE', lbl: 'I₂' }
  ];
  for (const w of wData) {
    const r2 = 16 + Math.abs(w.I) * 1.4;
    ctx.beginPath(); ctx.arc(w.cx, w.cy, r2 + 3 + Math.sin(animT * 3) * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = w.col + '18'; ctx.fill();
    ctx.beginPath(); ctx.arc(w.cx, w.cy, r2, 0, Math.PI * 2);
    ctx.fillStyle = w.bg; ctx.fill();
    ctx.strokeStyle = w.col; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = w.col; ctx.font = '500 17px Mulish,system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(w.I === 0 ? '0' : w.I > 0 ? '⊙' : '⊗', w.cx, w.cy + 7);
    ctx.font = '600 12px Mulish,system-ui,sans-serif';
    bgText(ctx, w.lbl + ' ' + (w.I >= 0 ? '+' : '') + w.I + ' A', w.cx, w.cy + r2 + 17, w.col);
  }

  // Légende bas
  const legY = H - 12;
  ctx.font = '12px Mulish,system-ui,sans-serif'; ctx.textAlign = 'left';
  const narrow = W < 520;
  bgText(ctx, '— B (I₁), nb lignes ∝ |I₁|', 12, narrow ? legY - 18 : legY, '#E24B4A');
  bgText(ctx, '— B (I₂), nb lignes ∝ |I₂|', narrow ? 12 : W / 2 - 80, legY, '#7F77DD');

  // Info bas
  const sign = I1 * I2 > 0 ? 'même sens → attraction' : 'sens opposés → répulsion';
  document.getElementById('info').textContent =
    `I₁=${I1 >= 0 ? '+' : ''}${I1} A, I₂=${I2 >= 0 ? '+' : ''}${I2} A — ${sign} — F/L = μ₀|I₁I₂|/(2πd) = ${(FperL * 1000).toFixed(3)} mN/m`;

  requestAnimationFrame(draw);
}

draw();
</script>
